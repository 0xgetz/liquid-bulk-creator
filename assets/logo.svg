<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Liquid Bulk Creator logo">
  <defs>
    <linearGradient id="dropGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="55%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#0B1020"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- repeated drops = bulk -->
  <g opacity="0.30" filter="url(#soft)">
    <path d="M256 96c0 0-64 70-64 118a64 64 0 0 0 128 0c0-48-64-118-64-118z" fill="#06B6D4"/>
  </g>
  <g opacity="0.45">
    <path d="M168 150c0 0-40 44-40 74a40 40 0 0 0 80 0c0-30-40-74-40-74z" fill="#8B5CF6"/>
    <path d="M344 150c0 0-40 44-40 74a40 40 0 0 0 80 0c0-30-40-74-40-74z" fill="#22D3EE"/>
  </g>

  <!-- main drop -->
  <path d="M256 108c0 0-86 94-86 158a86 86 0 0 0 172 0c0-64-86-158-86-158z" fill="url(#dropGrad)"/>
  <path d="M256 132c0 0-66 76-66 128a66 66 0 0 0 20 47c-6-140 76-175 78-176-10-14-22-27-32-39-4 14-10 28-10 40z" fill="#ffffff" opacity="0.14"/>

  <!-- key hole / key -->
  <g transform="translate(256 268)">
    <circle r="30" fill="#0B1020"/>
    <circle r="30" fill="none" stroke="url(#keyGrad)" stroke-width="8"/>
    <rect x="22" y="-9" width="78" height="18" rx="9" fill="url(#keyGrad)"/>
    <rect x="72" y="6" width="12" height="24" rx="5" fill="url(#keyGrad)"/>
    <rect x="90" y="6" width="12" height="24" rx="5" fill="url(#keyGrad)"/>
  </g>

  <!-- orbit ring -->
  <ellipse cx="256" cy="300" rx="184" ry="58" fill="none" stroke="#06B6D4" stroke-width="3" opacity="0.35"/>
  <ellipse cx="256" cy="300" rx="184" ry="58" fill="none" stroke="#8B5CF6" stroke-width="3" opacity="0.22" transform="rotate(18 256 300)"/>
</svg>
